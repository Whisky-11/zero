name: gitleaks
on: [push, pull_request]
concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Umbra (self-hosted, Ahmad's Mac) runs only this repo's own branches; a pull
# request from a fork always goes to a GitHub-hosted runner.
jobs:
  scan:
    runs-on: ${{ (vars.USE_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","wsl2"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          set -eu
          GITLEAKS_VERSION=8.21.2
          case "$(uname -m)" in aarch64|arm64) GLARCH=arm64;; *) GLARCH=x64;; esac
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GLARCH}.tar.gz" \
            | tar -xz gitleaks   # into the workspace: Umbra runners share /usr/local/bin
          ./gitleaks version
      - name: Run gitleaks
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
