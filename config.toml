[wake]
# Custom "hey zero" model (Option B, ACAV100M-trained): ~1.77 false-wakes/hr, recall ~0.60.
# Threshold 0.5 favours recall now that the model's own false-positive rate is tiny.
# If it ever over-triggers, raise toward 0.6; to use the built-in instead: model = "hey_jarvis"
model = "zero/models/hey_zero.onnx"
threshold = 0.5

[stt]
model = "base"            # tiny|base|small|medium|large-v3 (base ~2x faster than small, fine for commands)
device = "auto"           # auto = CUDA if available (Windows/NVIDIA) else CPU (Mac)
compute_type = "float16"
min_silence_ms = 400      # silence after you stop talking before it cuts off (lower = snappier)
# Hallucination gate: drop Whisper segments that are probably noise, not speech
# (Whisper invents phrases from ambient audio/music and Zero was acting on them).
# Raise no_speech_max / lower logprob_min if real speech gets dropped.
no_speech_max = 0.6       # discard segments with no_speech_prob above this
logprob_min = -1.0        # discard segments with avg_logprob below this

[voice]
lang_code = "b"           # British English
voice = "bm_george"
speed = 1.0

[brain]
# Sonnet is the daily driver (snappy voice latency). Zero escalates a single turn
# to Opus when the request needs deeper reasoning (matched by escalate_on below or
# an explicit "use opus"); everything else stays on Sonnet. Model is switched per
# turn on the one warm client via the SDK's set_model — no extra latency.
model = "claude-sonnet-4-6"
opus_model = "claude-opus-4-8"
trivial_model = "claude-haiku-4-5-20251001"
# substrings (case-insensitive) in your spoken request that route THIS turn to Opus
escalate_on = ["use opus", "think hard", "think harder", "deeply", "carefully", "thoroughly", "step by step", "architect", "design the", "debug", "analyze", "review the", "plan the", "figure out why", "complicated", "complex"]
# trivial tier (Haiku) — ultra-short chit-chat / acks that never need Sonnet.
# A turn routes to trivial_model when it matches trivial_on OR is <= trivial_max_words
# (and isn't an escalate_on turn). Tool safety is unaffected (the gate still confirms).
trivial_on = ["stop", "thanks", "thank you", "thank you zero", "never mind", "nevermind", "cancel", "forget it", "hello", "hi", "hey", "hey zero", "good morning", "good night", "goodnight", "you there", "are you there", "what time is it", "whats the time", "what's the time", "how are you"]
trivial_max_words = 2
user_name = "Ahmad"

[hud]
ws_port = 8765
http_port = 9911          # keeps the 911 (Porsche) reference but >1024 so macOS allows a non-root bind. Ports <1024 (e.g. 911) require root on macOS → HUD silently fails to start.

[gate]
# tool_input substrings that force a spoken confirmation
confirm_patterns = ["rm ", "del ", "rmdir", "git push", "git reset --hard", "shutdown", "Remove-Item", "format ", "DROP TABLE", "kill ",
    # macOS: these drive other apps or change the system — Zero's mac tools are gated
    # separately, so shelling out to them must not be a way around the gate
    "osascript", "cliclick", "sudo ", "killall", "pkill", "launchctl", "defaults write", "defaults delete",
    "diskutil", "reboot", "halt", "networksetup", "tccutil", "csrutil", "spctl", "mv ", "chmod ", "chown ", "trash "]
# patterns Zero refuses outright, even if asked
never_patterns = ["rm -rf /", "rm -rf /*", ":(){", "mkfs", "format c:", "diskutil eraseDisk", "diskutil eraseVolume", "csrutil disable"]

[mac]
# Zero's hands + eyes on macOS (screenshot, click, type, keys, apps, AppleScript, Shortcuts).
enabled = true
# true = every click / keystroke needs a spoken "yes". false = only in sensitive_apps.
# (AppleScript, Shortcuts and quitting apps always confirm; looking never does.)
confirm_input = false
# apps where a stray click or keystroke is costly: messages, money, the shell, settings
sensitive_apps = ["Mail", "Messages", "WhatsApp", "Slack", "Telegram", "Discord",
                  "Terminal", "iTerm2", "Warp", "System Settings", "System Preferences",
                  "Keychain Access", "1Password", "1Password 7", "Bitwarden", "App Store"]

[app]
# Zero.app (menu bar). Push-to-talk from anywhere — needs Accessibility for Zero.
hotkey = "alt+space"
window_on_top = false
